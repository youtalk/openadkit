name: autosd-x5h-rootfs
on:
  push:
    branches: [feat/autosd-x5h-rootfs]
  pull_request:
    paths:
      - platforms/autosd/x5h/**
      - .github/workflows/autosd-x5h-rootfs.yaml
permissions:
  contents: read
# Push (branch) and pull_request (paths filter) both fire for the same commit
# once the fork PR exists, and this job is multi-hour arm64 CI (aib build +
# kernel compile + emulated container builds + a TCG QEMU boot). Group by the
# commit SHA rather than by ref/PR-number so a push-triggered run and the
# pull_request-triggered run it also fires collapse into one concurrency slot
# and the redundant one is cancelled instead of both running to completion.
# `github.sha` alone would not do this: on a pull_request event it is the
# ephemeral merge commit, not the head commit, so it never matches the push
# event's `github.sha` for the same commit. `pull_request.head.sha` is the
# actual head commit and does match. Two different commits still get two
# independent slots, so an in-flight run for an older commit during
# iteration is not cancelled by a newer, unrelated push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  build-and-gate:
    runs-on: ubicloud-standard-16-arm
    # Generous but bounded: the job is expected to run for hours (aib build,
    # a from-scratch kernel compile, docker build/skopeo for the test
    # images -- both native on this arm64 runner, not emulated, so cheaper
    # than the platform-generic worst case -- and a TCG QEMU boot, whose
    # gate alone budgets up to 1800s to a login prompt plus a 900s
    # inactivity window per marker). 240 stays well below the 360-minute
    # platform default while giving that worst case real headroom, so a
    # genuinely stuck step (a hung prompt, a runaway retry loop) fails
    # within a single working session instead of the ceiling itself
    # wasting the whole cycle with no diagnostic.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Report disk headroom (before host tool install)
        run: df -h /

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman skopeo qemu-system-arm qemu-utils expect \
            flex bison libssl-dev libelf-dev bc

      - name: Put container storage on a non-overlay location (aib CI pattern)
        # The unconditional `rm -rf` this step used to open with started
        # failing on the arm64 runner image with `cannot remove
        # /var/lib/containers/storage/overlay: Device or resource busy` --
        # the image now ships a podman store with something already mounted
        # under it. Same runner label, same step, green on 2026-08-03 and red
        # on 2026-08-18, so this is runner-image drift, not a workflow change.
        #
        # Unmount whatever is there (deepest first, lazily) before removing,
        # and let the removal fail without failing the step: what this step
        # actually has to guarantee is that podman *writes* to a non-overlay
        # location, and the bind mounts below deliver that whether or not the
        # old tree could be deleted first. The findmnt at the end is the real
        # assertion -- if the binds are not in place the step fails there,
        # rather than silently leaving podman on the runner's overlay.
        run: |
          sudo systemctl stop podman.socket podman.service 2>/dev/null || true
          awk '$2 ~ /^\/(var\/lib|run)\/containers/ {print $2}' /proc/self/mounts \
            | sort -r | while read -r m; do sudo umount -l "$m" || true; done
          sudo rm -rf /var/lib/containers /run/containers || true
          # Same root cause, second symptom: the image also ships a podman SHM
          # lock segment, and one sized for a different lock count makes every
          # later podman call die with `failed to open 2048 locks in
          # /libpod_lock: numerical result out of range` (exit 125) before it
          # does any work. Listed before removal so the log shows whether the
          # segment was pre-existing rather than leaving that a guess.
          echo "--- /dev/shm before ---"; sudo ls -l /dev/shm || true
          sudo rm -f /dev/shm/libpod_lock /dev/shm/libpod_rootless_lock
          sudo mkdir -p "$RUNNER_TEMP/_containers/var" "$RUNNER_TEMP/_containers/run" /var/lib/containers /run/containers
          sudo mount --bind "$RUNNER_TEMP/_containers/var" /var/lib/containers
          sudo mount --bind "$RUNNER_TEMP/_containers/run" /run/containers
          findmnt -no SOURCE,TARGET /var/lib/containers
          findmnt -no SOURCE,TARGET /run/containers
          # Assert podman is actually usable now. Without this the next
          # failure is a bare exit 125 from inside auto-image-builder.sh,
          # which says nothing about which of these preconditions broke.
          sudo podman info --format '{{.Version.Version}} {{.Store.GraphRoot}} {{.Store.RunRoot}}'

      - name: Show container runtime versions (diagnostic)
        # `Error: OCI runtime error: crun: unknown version specified` (exit
        # 126) from the builder-image build points at a podman/OCI-runtime
        # spec mismatch, but which side is stale is not something to guess:
        # the runner image ships its own podman (info reports 5.8.4) while
        # `Install host tools` also apt-installs one, so PATH order and the
        # runtime each resolves to are the facts needed to fix it. Never
        # fails the job -- it exists to put those facts in the log.
        if: ${{ !cancelled() }}
        run: |
          which -a podman crun runc || true
          podman --version || true
          crun --version || true
          runc --version || true
          sudo podman info --format 'runtime={{.Host.OCIRuntime.Name}} path={{.Host.OCIRuntime.Path}} version={{.Host.OCIRuntime.Version}}' || true
          dpkg -l podman crun runc 2>/dev/null | tail -5 || true

      - name: Install automotive-image-builder runner
        run: |
          curl -fL -o auto-image-builder.sh \
            "https://gitlab.com/CentOS/automotive/src/automotive-image-builder/-/raw/main/auto-image-builder.sh?ref_type=heads"
          chmod +x auto-image-builder.sh
          sudo bash ./auto-image-builder.sh --help | head -30

      - name: Show aib command help (source of truth for the build invocation below)
        # The current aib CLI is bootc-shaped: no list-exports, no --mode,
        # no --export. Capture the live --help output for `build` and
        # `to-disk-image` plus the distro/target lists, so a flag mismatch
        # in the next two steps is diagnosed from this output, not guessed.
        run: |
          sudo bash ./auto-image-builder.sh build --help || true
          sudo bash ./auto-image-builder.sh to-disk-image --help || true
          sudo bash ./auto-image-builder.sh list-targets || true
          sudo bash ./auto-image-builder.sh list-distro || true

      - name: Build the aib builder image
        run: |
          cd platforms/autosd/x5h
          sudo AIB_PODMAN_OPTIONS="-v /run/containers:/run/containers" \
            bash "$GITHUB_WORKSPACE/auto-image-builder.sh" build-builder --distro autosd10-sig

      - name: Validate resolved aib variables (dry-run; confirms extra_repos took effect)
        # --dump-variables alone does not stop the build, despite the CLI
        # help text ("...and exit"): aib/osbuild.py only sets
        # defines["print_variables"] = True, which an mpp-eval in
        # computed-vars.ipp.yml prints with no sys.exit on that path.
        # --dry-run is the flag that actually stops before osbuild runs
        # (aib/main.py only appends an export "if not args.dry_run") --
        # every upstream test pairs the two, so this step does too. With
        # --dry-run, full manifest generation still runs, including
        # mpp-depsolve, so this is a fast, fail-first validation of the
        # EPEL change: if depsolve is broken this step fails here, before
        # the real build below spends time on it. No output filtering:
        # the full dump (including extra_repos) goes straight to the step
        # log, and the step's own exit status is the real one -- nothing
        # here should swallow either.
        run: |
          cd platforms/autosd/x5h
          sudo AIB_PODMAN_OPTIONS="-v /run/containers:/run/containers" \
            bash "$GITHUB_WORKSPACE/auto-image-builder.sh" build --dump-variables --dry-run --tar \
            --distro autosd10-sig --target qemu \
            --define-file aib/vars.yml \
            aib/x5h-rootfs.aib.yml aib/x5h-rootfs.tar

      - name: Build the x5h rootfs tar (aib build --tar)
        # --tar builds a tar file with the container content directly,
        # instead of a container image -- this replaces a build + podman
        # create + podman export round trip with a single aib invocation,
        # removing the root-vs-user podman store question entirely and
        # cutting a step from the critical path.
        run: |
          cd platforms/autosd/x5h
          sudo AIB_PODMAN_OPTIONS="-v /run/containers:/run/containers" \
            bash "$GITHUB_WORKSPACE/auto-image-builder.sh" build --tar \
            --distro autosd10-sig --target qemu \
            --define-file aib/vars.yml \
            aib/x5h-rootfs.aib.yml aib/x5h-rootfs.tar
          ls -lh aib/x5h-rootfs.tar

      - name: Inspect the tar export (podman present, btrfs-progs present, no ostree-repo layout)
        # Positive checks anchored at a path component boundary: an
        # unanchored grep for e.g. "usr/bin/podman" would also match
        # "ostree/deploy/.../usr/bin/podman".
        #
        # The ostree/composefs guard is anchored at the archive *root*,
        # not "anywhere in the path". bootc.spec Requires both ostree and
        # composefs, so every aib build output -- ordinary or not --
        # always carries usr/lib/ostree/ostree-prepare-root,
        # usr/lib/ostree/ostree-remount and usr/bin/composefs-info. A
        # path-anywhere match on "ostree/" or "composefs" is therefore
        # unconditionally true for every export and tells us nothing; it
        # would turn "dropping --mode package cost us the non-ostree
        # property" into a guaranteed false alarm on every run. The
        # genuine failure mode this guard exists to catch is a top-level
        # ostree/repo/objects/... (or sysroot/ostree/...) layout, which
        # only a root anchor can distinguish from those ordinary package
        # files -- if it fires, that's a real finding to fail on, not
        # something to relax.
        run: |
          cd platforms/autosd/x5h
          tar tf aib/x5h-rootfs.tar | head -50
          tar tf aib/x5h-rootfs.tar | grep -qE '(^|/)usr/bin/podman' || { echo "FATAL: no podman"; exit 1; }
          tar tf aib/x5h-rootfs.tar | grep -qE '(^|/)usr/s?bin/mkfs\.btrfs' || { echo "FATAL: no btrfs-progs"; exit 1; }
          echo "--- ostree/composefs packages present (expected on a bootc image, informational only) ---"
          tar tf aib/x5h-rootfs.tar | grep -E '(^|/)(ostree|composefs)' || true
          if tar tf aib/x5h-rootfs.tar | grep -qE '^(\./)?(ostree|sysroot/ostree)/'; then
            echo "FATAL: ostree-repo layout detected in the podman-exported rootfs"
            exit 1
          fi

      - name: Derive the ext4 export from the tar
        # Loop-mount + extract -- the same tar-to-ext4 reassembly Task 7's
        # local replay documents, so the two now agree instead of diverging.
        run: |
          cd platforms/autosd/x5h
          truncate -s 6G aib/x5h-rootfs.ext4
          sudo mkfs.ext4 -q aib/x5h-rootfs.ext4
          mnt="$(mktemp -d)"
          sudo mount -o loop aib/x5h-rootfs.ext4 "$mnt"
          # --xattrs: plain `tar xf` silently drops extended attributes on
          # extract (exit 0, no warning) even when the archive carries
          # them, so security.capability on e.g. newuidmap/newgidmap/ping
          # would otherwise vanish here. Safe specifically because this
          # step runs on the CI host's ext4 (which has EXT4_FS_SECURITY),
          # not the BSP-mimic target the gate boots -- GATE2 exists
          # precisely because that restore fails on the constrained kernel.
          sudo tar --xattrs --xattrs-include='*.*' -xf aib/x5h-rootfs.tar -C "$mnt"
          sudo umount "$mnt"
          rmdir "$mnt"

      - name: Build the mimic kernel (native aarch64)
        # Consumes nothing the aib steps produce (Task 3's own source
        # tree/config), so this runs even if aib failed above: it's the
        # first time this kernel has ever compiled, and losing that signal
        # to an unrelated aib failure is expensive on hours-per-iteration
        # arm64 CI ahead of a one-shot board session.
        if: ${{ !cancelled() }}
        run: |
          platforms/autosd/x5h/kernel/build-mimic-kernel.sh "$RUNNER_TEMP/mimic"

      - name: Build test images
        # Also aib-independent, and the first real execution of `docker
        # build` on a runner with working networking (this sandbox has
        # net.ipv4.ip_forward=0, so it was previously only proven via a
        # non-committed --network host copy) -- same reasoning as above.
        if: ${{ !cancelled() }}
        run: |
          sudo systemctl start docker 2>/dev/null || true
          platforms/autosd/x5h/scripts/make-test-images.sh "$RUNNER_TEMP/testimages"

      - name: Inject test payload into the ext4 export
        run: |
          cd platforms/autosd/x5h
          scripts/inject-test-images.sh aib/x5h-rootfs.ext4 "$RUNNER_TEMP/testimages"

      - name: Report disk headroom (before the QEMU gate)
        run: df -h /

      - name: Run the QEMU gate (same-arch TCG, no /dev/kvm on this runner)
        run: |
          cd platforms/autosd/x5h
          [ -w /dev/kvm ] && echo "accel: KVM" || echo "accel: TCG (no /dev/kvm)"
          sudo ./scripts/qemu-gate.exp ./scripts/run-qemu-gate.sh \
            "$RUNNER_TEMP/mimic/Image" aib/x5h-rootfs.ext4 "$RUNNER_TEMP/blank.img" /tmp/x5h-gate.log

      - name: Show gate markers
        # Its own step under always(): under bash -e a nonzero qemu-gate.exp
        # aborts the step it's in, so folded into the gate step above this
        # summary would never print precisely when the gate fails.
        if: always()
        run: |
          echo "--- gate markers ---"
          grep -E 'GATE[0-9_]+' /tmp/x5h-gate.log || true

      - name: Stage debugging artifacts into one flat directory before upload
        # The four source paths span three unrelated absolute-path roots
        # ($GITHUB_WORKSPACE, $RUNNER_TEMP, /tmp), so uploading them
        # directly would make upload-artifact@v4 compute a least-common-
        # ancestor of "/" and preserve each file's full absolute path
        # inside the archive. That still works (Task 7's `find`-based
        # lookups are depth-agnostic) but is needlessly deep. Stage into
        # one directory first so the archive is flat instead.
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/x5h-bundle"
          cp -f platforms/autosd/x5h/aib/x5h-rootfs.tar "$RUNNER_TEMP/x5h-bundle/" 2>/dev/null || true
          cp -f "$RUNNER_TEMP/mimic/Image" "$RUNNER_TEMP/x5h-bundle/" 2>/dev/null || true
          cp -rf "$RUNNER_TEMP/testimages" "$RUNNER_TEMP/x5h-bundle/" 2>/dev/null || true
          cp -f /tmp/x5h-gate.log "$RUNNER_TEMP/x5h-bundle/" 2>/dev/null || true
          ls -lhR "$RUNNER_TEMP/x5h-bundle" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x5h-gate-bundle
          path: ${{ runner.temp }}/x5h-bundle
          retention-days: 14
          if-no-files-found: warn
