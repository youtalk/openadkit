name: build-all-images

on:
  push:
    paths:
      - 'components/docker-bake.hcl'
      - 'components/common/**'
      - 'components/sensing-perception/**'
      - 'components/localization-mapping/**'
      - 'components/planning-control/**'
      - 'components/vehicle-system/**'
      - 'components/api/**'
      - 'components/visualizer/**'
      - 'components/simulator/**'
      - 'components/universe/**'
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

concurrency:
  group: build-all-images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX_COMPONENT: ghcr.io/${{ github.repository_owner }}/openadkit
  BAKE_FILE: components/docker-bake.hcl

jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      autoware_ref: ${{ steps.prepare.outputs.autoware_ref }}
      build_tag: ${{ steps.prepare.outputs.build_tag }}
    steps:
      - name: Resolve shared build inputs
        id: prepare
        run: |
          set -euo pipefail
          autoware_ref=$(git ls-remote https://github.com/autowarefoundation/autoware refs/heads/main | cut -f1)
          build_tag="$(date -u +'%Y%m%d')-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "autoware_ref=${autoware_ref}" >> "$GITHUB_OUTPUT"
          echo "build_tag=${build_tag}" >> "$GITHUB_OUTPUT"
        shell: bash

  # =============================================================================
  # Stage 1: Build universe-common images
  # =============================================================================
  build-universe-common:
    needs: prepare
    runs-on: ${{ (github.repository_owner == 'youtalk' && github.actor == 'youtalk') && (matrix.platform == 'linux/amd64' && 'ubicloud-standard-16' || 'ubicloud-standard-16-arm') || (matrix.platform == 'linux/amd64' && 'ubuntu-22.04' || 'ubuntu-22.04-arm') }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        platform: [linux/amd64, linux/arm64]
        ros-distro: [humble, jazzy]
    steps:
      - name: Install jq and vcs2l
        run: |
          sudo apt-get update
          sudo apt-get install -y jq pipx
          pipx install vcs2l
        shell: bash

      - name: Checkout OpenADKit repository
        uses: actions/checkout@v6

      - name: Checkout Autoware repository
        uses: actions/checkout@v6
        with:
          repository: autowarefoundation/autoware
          ref: ${{ needs.prepare.outputs.autoware_ref }}
          path: autoware
          fetch-depth: 1

      - name: Pull Autoware Source
        run: |
            mkdir -p autoware/src
            vcs import --shallow autoware/src < autoware/repositories/autoware.repos
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for universe-common-devel
        id: meta-universe-common-devel
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX_COMPONENT }}
          bake-target: docker-metadata-action-universe-common-devel
          tags: |
            type=raw,value=universe-common-devel-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }},enable={{is_default_branch}}
            type=raw,value=universe-common-devel-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
          flavor: |
            latest=false

      - name: Extract metadata for universe-common
        id: meta-universe-common
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX_COMPONENT }}
          bake-target: docker-metadata-action-universe-common
          tags: |
            type=raw,value=universe-common-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }},enable={{is_default_branch}}
            type=raw,value=universe-common-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
          flavor: |
            latest=false

      - name: Ensure upstream Autoware base images exist
        env:
          ROS_DISTRO: ${{ matrix.ros-distro }}
          UPSTREAM_TAG: ${{ vars.UPSTREAM_TAG }}
        run: |
          set -euo pipefail
          refs=$(docker buildx bake -f "${BAKE_FILE}" --print ${{ matrix.target || 'universe-common' }} 2>/dev/null \
            | jq -r '[.target[].contexts // {} | to_entries[].value]
                     | map(select(startswith("docker-image://ghcr.io/autowarefoundation/autoware:")))
                     | unique[]' | sed 's#^docker-image://##')
          [ -z "${refs}" ] && { echo "No upstream refs for this group."; exit 0; }
          fail=0
          while IFS= read -r ref; do
            [ -z "${ref}" ] && continue
            if docker buildx imagetools inspect "${ref}" >/dev/null 2>&1; then echo "OK: ${ref}";
            else echo "::error::Missing upstream image: ${ref}"; fail=1; fi
          done <<< "${refs}"
          [ "${fail}" -eq 0 ]

      - name: Build and push universe-common
        uses: docker/bake-action@v5
        env:
          ROS_DISTRO: ${{ matrix.ros-distro }}
          UPSTREAM_TAG: ${{ vars.UPSTREAM_TAG }}
        with:
          files: |
            ${{ env.BAKE_FILE }}
            ${{ steps.meta-universe-common-devel.outputs.bake-file }}
            ${{ steps.meta-universe-common.outputs.bake-file }}
          targets: |
            universe-common-devel
            universe-common
          push: true
          set: |
            *.platform=${{ matrix.platform }}
            *.cache-from=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:universe-common-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-main
            *.cache-to=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:universe-common-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-main,mode=max

  # =============================================================================
  # Stage 2: Build component images (parallel)
  # =============================================================================
  build-components:
    runs-on: ${{ (github.repository_owner == 'youtalk' && github.actor == 'youtalk') && format('ubicloud-standard-{0}{1}', startsWith(matrix.target, 'sensing-perception') && '30' || '16', matrix.platform == 'linux/amd64' && '' || '-arm') || (matrix.platform == 'linux/amd64' && 'ubuntu-22.04' || 'ubuntu-22.04-arm') }}
    needs: [prepare, build-universe-common]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        platform: [linux/amd64, linux/arm64]
        ros-distro: [humble, jazzy]
        target:
          - sensing-perception
          - localization-mapping
          - planning-control
          - vehicle-system
          - api
          - visualizer
          - simulator
        include:
          # CUDA variant only on amd64
          - platform: linux/amd64
            ros-distro: humble
            target: sensing-perception-cuda
          - platform: linux/amd64
            ros-distro: jazzy
            target: sensing-perception-cuda
    steps:
      - name: Install jq and vcs2l
        run: |
          sudo apt-get update
          sudo apt-get install -y jq pipx
          pipx install vcs2l
        shell: bash

      - name: Checkout OpenADKit repository
        uses: actions/checkout@v6

      - name: Checkout Autoware repository
        uses: actions/checkout@v6
        with:
          repository: autowarefoundation/autoware
          ref: ${{ needs.prepare.outputs.autoware_ref }}
          path: autoware
          fetch-depth: 1

      - name: Pull Autoware Source
        run: |
            mkdir -p autoware/src
            vcs import --shallow autoware/src < autoware/repositories/autoware.repos
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.target }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX_COMPONENT }}
          bake-target: docker-metadata-action-${{ matrix.target }}
          tags: |
            type=raw,value=${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }},enable={{is_default_branch}}
            type=raw,value=${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
          flavor: |
            latest=false

      - name: Ensure upstream Autoware base images exist
        env:
          ROS_DISTRO: ${{ matrix.ros-distro }}
          UPSTREAM_TAG: ${{ vars.UPSTREAM_TAG }}
        run: |
          set -euo pipefail
          refs=$(docker buildx bake -f "${BAKE_FILE}" --print ${{ matrix.target || 'universe-common' }} 2>/dev/null \
            | jq -r '[.target[].contexts // {} | to_entries[].value]
                     | map(select(startswith("docker-image://ghcr.io/autowarefoundation/autoware:")))
                     | unique[]' | sed 's#^docker-image://##')
          [ -z "${refs}" ] && { echo "No upstream refs for this group."; exit 0; }
          fail=0
          while IFS= read -r ref; do
            [ -z "${ref}" ] && continue
            if docker buildx imagetools inspect "${ref}" >/dev/null 2>&1; then echo "OK: ${ref}";
            else echo "::error::Missing upstream image: ${ref}"; fail=1; fi
          done <<< "${refs}"
          [ "${fail}" -eq 0 ]

      - name: Build and push ${{ matrix.target }}
        uses: docker/bake-action@v5
        env:
          ROS_DISTRO: ${{ matrix.ros-distro }}
          UPSTREAM_TAG: ${{ vars.UPSTREAM_TAG }}
        with:
          files: |
            ${{ env.BAKE_FILE }}
            ${{ steps.meta.outputs.bake-file }}
          targets: ${{ matrix.target }}
          push: true
          set: |
            *.platform=${{ matrix.platform }}
            *.contexts.universe-common-devel=docker-image://${{ env.IMAGE_PREFIX_COMPONENT }}:universe-common-devel-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.contexts.universe-common=docker-image://${{ env.IMAGE_PREFIX_COMPONENT }}:universe-common-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.cache-from=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-main
            *.cache-to=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-main,mode=max

  # =============================================================================
  # Stage 3: Build universe and universe-cuda images (parallel)
  # =============================================================================
  build-universe:
    runs-on: ${{ (github.repository_owner == 'youtalk' && github.actor == 'youtalk') && (matrix.platform == 'linux/amd64' && 'ubicloud-standard-16' || 'ubicloud-standard-16-arm') || (matrix.platform == 'linux/amd64' && 'ubuntu-22.04' || 'ubuntu-22.04-arm') }}
    needs: [prepare, build-universe-common, build-components]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        platform: [linux/amd64, linux/arm64]
        ros-distro: [humble, jazzy]
        target: [universe]
        include:
          # CUDA variant only on amd64
          - platform: linux/amd64
            ros-distro: humble
            target: universe-cuda
          - platform: linux/amd64
            ros-distro: jazzy
            target: universe-cuda
    steps:
      - name: Checkout OpenADKit repository
        uses: actions/checkout@v6

      - name: Free Disk Space (Ubuntu)
        uses: ./.github/actions/free-disk-space

      - name: Install jq and vcs2l
        run: |
          sudo apt-get update
          sudo apt-get install -y jq pipx
          pipx install vcs2l
        shell: bash

      - name: Checkout Autoware repository
        uses: actions/checkout@v6
        with:
          repository: autowarefoundation/autoware
          ref: ${{ needs.prepare.outputs.autoware_ref }}
          path: autoware
          fetch-depth: 1

      - name: Pull Autoware Source
        run: |
            mkdir -p autoware/src
            vcs import --shallow autoware/src < autoware/repositories/autoware.repos
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.target }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX_COMPONENT }}
          bake-target: docker-metadata-action-${{ matrix.target }}
          tags: |
            type=raw,value=${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }},enable={{is_default_branch}}
            type=raw,value=${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
          flavor: |
            latest=false

      - name: Ensure upstream Autoware base images exist
        env:
          ROS_DISTRO: ${{ matrix.ros-distro }}
          UPSTREAM_TAG: ${{ vars.UPSTREAM_TAG }}
        run: |
          set -euo pipefail
          refs=$(docker buildx bake -f "${BAKE_FILE}" --print ${{ matrix.target || 'universe-common' }} 2>/dev/null \
            | jq -r '[.target[].contexts // {} | to_entries[].value]
                     | map(select(startswith("docker-image://ghcr.io/autowarefoundation/autoware:")))
                     | unique[]' | sed 's#^docker-image://##')
          [ -z "${refs}" ] && { echo "No upstream refs for this group."; exit 0; }
          fail=0
          while IFS= read -r ref; do
            [ -z "${ref}" ] && continue
            if docker buildx imagetools inspect "${ref}" >/dev/null 2>&1; then echo "OK: ${ref}";
            else echo "::error::Missing upstream image: ${ref}"; fail=1; fi
          done <<< "${refs}"
          [ "${fail}" -eq 0 ]

      - name: Build and push ${{ matrix.target }}
        uses: docker/bake-action@v5
        env:
          ROS_DISTRO: ${{ matrix.ros-distro }}
          UPSTREAM_TAG: ${{ vars.UPSTREAM_TAG }}
        with:
          files: |
            ${{ env.BAKE_FILE }}
            ${{ steps.meta.outputs.bake-file }}
          targets: ${{ matrix.target }}
          push: true
          set: |
            *.platform=${{ matrix.platform }}
            *.contexts.sensing-perception=docker-image://${{ env.IMAGE_PREFIX_COMPONENT }}:sensing-perception-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.contexts.sensing-perception-cuda=docker-image://${{ env.IMAGE_PREFIX_COMPONENT }}:sensing-perception-cuda-amd64-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.contexts.localization-mapping=docker-image://${{ env.IMAGE_PREFIX_COMPONENT }}:localization-mapping-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.contexts.planning-control=docker-image://${{ env.IMAGE_PREFIX_COMPONENT }}:planning-control-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.contexts.vehicle-system=docker-image://${{ env.IMAGE_PREFIX_COMPONENT }}:vehicle-system-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.contexts.api=docker-image://${{ env.IMAGE_PREFIX_COMPONENT }}:api-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.contexts.visualizer=docker-image://${{ env.IMAGE_PREFIX_COMPONENT }}:visualizer-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.contexts.simulator=docker-image://${{ env.IMAGE_PREFIX_COMPONENT }}:simulator-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-${{ needs.prepare.outputs.build_tag }}
            *.cache-from=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-main
            *.cache-to=type=registry,ref=ghcr.io/${{ github.repository_owner }}/openadkit-buildcache:${{ matrix.target }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-${{ matrix.ros-distro }}-main,mode=max

  # =============================================================================
  # Stage 4: Create multi-arch manifests
  # =============================================================================
  create-manifests:
    runs-on: ubuntu-22.04
    needs: [prepare, build-universe-common, build-components, build-universe]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        ros-distro: [humble, jazzy]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Combine multi-arch images
        uses: ./.github/actions/combine-multi-arch-images
        with:
          ros-distro: ${{ matrix.ros-distro }}
          build-tag: ${{ needs.prepare.outputs.build_tag }}
          registry: ${{ env.REGISTRY }}
          image-prefix-component: ${{ env.IMAGE_PREFIX_COMPONENT }}
          component-targets: >-
            universe-common-devel
            universe-common
            sensing-perception
            sensing-perception-cuda
            localization-mapping
            planning-control
            vehicle-system
            api
            visualizer
            simulator
            universe
            universe-cuda
          token: ${{ secrets.GITHUB_TOKEN }}
