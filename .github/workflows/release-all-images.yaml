name: release-all-images

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      autoware_tag:
        description: The Autoware tag to release
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX_COMPONENT: ghcr.io/${{ github.repository_owner }}/openadkit
  BAKE_FILE: components/docker-bake.hcl

jobs:
  detect-autoware-tag:
    name: Detect latest Autoware release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      autoware_tag: ${{ steps.latest.outputs.tag }}
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Validate manual tag format
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "${{ inputs.autoware_tag }}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || (echo "Invalid tag format '${{ inputs.autoware_tag }}': must be X.Y.Z" && exit 1)

      - name: Get latest upstream semver tag (e.g. 1.2.3)
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.autoware_tag }}"
          else
            tags_json=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/autowarefoundation/autoware/tags?per_page=3")
            tag=$(
              echo "$tags_json" \
              | jq -r '.[].name' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V \
              | tail -n 1
            )
          fi
          [ -n "$tag" ] || (echo "No semver tag found" && exit 1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Tag: $tag"

      - name: Cache lookup for processed tag
        id: cache
        uses: actions/cache@v4
        with:
          path: .autoware-tag-marker
          key: autoware-tag-${{ steps.latest.outputs.tag }}
          restore-keys: |
            autoware-tag-

      - name: Decide whether to run
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — forcing run for tag ${{ steps.latest.outputs.tag }}"
          elif [ "${{ steps.cache.outputs.cache-hit }}" = "true" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Already processed tag ${{ steps.latest.outputs.tag }}"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "New tag detected: ${{ steps.latest.outputs.tag }}"
          fi

      - name: Create marker (so cache gets saved)
        if: steps.decide.outputs.should_run == 'true'
        run: |
          mkdir -p .autoware-tag-marker
          echo "${{ steps.latest.outputs.tag }}" > .autoware-tag-marker/tag.txt
          
  # =============================================================================
  # Stage 1: Build universe-common images
  # =============================================================================
  build-universe-common:
    runs-on: ${{ (github.repository_owner == 'youtalk' && github.actor == 'youtalk') && 'ubicloud-standard-16' || 'ubuntu-22.04' }}
    needs: detect-autoware-tag
    if: needs.detect-autoware-tag.outputs.should_run == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install jq and vcs2l
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3-pip
          pip install --no-cache-dir vcs2l
        shell: bash

      - name: Checkout OpenADKit repository
        uses: actions/checkout@v6

      - name: Checkout Autoware repository
        uses: actions/checkout@v6
        with:
          repository: autowarefoundation/autoware
          ref: ${{ needs.detect-autoware-tag.outputs.autoware_tag }}
          path: autoware
          fetch-depth: 1
    
      - name: Pull Autoware Source
        run: |
            mkdir -p autoware/src
            vcs import --shallow autoware/src < autoware/repositories/autoware.repos
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for universe-common-devel
        id: meta-universe-common-devel
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX_COMPONENT }}
          bake-target: docker-metadata-action-universe-common-devel
          tags: |
            type=raw,value=universe-common-devel-${{ needs.detect-autoware-tag.outputs.autoware_tag }}
          flavor: |
            latest=false

      - name: Extract metadata for universe-common
        id: meta-universe-common
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX_COMPONENT }}
          bake-target: docker-metadata-action-universe-common
          tags: |
            type=raw,value=universe-common-${{ needs.detect-autoware-tag.outputs.autoware_tag }}
          flavor: |
            latest=false

      - name: Ensure upstream Autoware base images exist
        env:
          ROS_DISTRO: jazzy
          UPSTREAM_TAG: ${{ needs.detect-autoware-tag.outputs.autoware_tag }}
        run: |
          set -euo pipefail
          refs=$(docker buildx bake -f "${BAKE_FILE}" --print universe-common 2>/dev/null \
            | jq -r '[.target[].contexts // {} | to_entries[].value]
                     | map(select(startswith("docker-image://ghcr.io/autowarefoundation/autoware:")))
                     | unique[]' | sed 's#^docker-image://##')
          [ -z "${refs}" ] && { echo "No upstream refs for this group."; exit 0; }
          fail=0
          while IFS= read -r ref; do
            [ -z "${ref}" ] && continue
            if docker buildx imagetools inspect "${ref}" >/dev/null 2>&1; then echo "OK: ${ref}";
            else echo "::error::Missing upstream image: ${ref}"; fail=1; fi
          done <<< "${refs}"
          [ "${fail}" -eq 0 ]

      - name: Build and push universe-common
        uses: docker/bake-action@v5
        env:
          ROS_DISTRO: jazzy
          UPSTREAM_TAG: ${{ needs.detect-autoware-tag.outputs.autoware_tag }}
        with:
          files: |
            ${{ env.BAKE_FILE }}
            ${{ steps.meta-universe-common-devel.outputs.bake-file }}
            ${{ steps.meta-universe-common.outputs.bake-file }}
          targets: |
            universe-common-devel
            universe-common
          push: true

  # =============================================================================
  # Stage 2: Build component images (parallel)
  # =============================================================================
  build-components:
    runs-on: ${{ (github.repository_owner == 'youtalk' && github.actor == 'youtalk') && 'ubicloud-standard-16' || 'ubuntu-22.04' }}
    needs: [build-universe-common, detect-autoware-tag]
    if: needs.detect-autoware-tag.outputs.should_run == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: sensing-perception
          - target: sensing-perception-cuda
          - target: localization-mapping
          - target: planning-control
          - target: vehicle-system
          - target: api
          - target: visualizer
          - target: simulator
    steps:
      - name: Install jq and vcs2l
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3-pip
          pip install --no-cache-dir vcs2l
        shell: bash

      - name: Checkout OpenADKit repository
        uses: actions/checkout@v6

      - name: Checkout Autoware repository
        uses: actions/checkout@v6
        with:
          repository: autowarefoundation/autoware
          ref: ${{ needs.detect-autoware-tag.outputs.autoware_tag }}
          path: autoware
          fetch-depth: 1
    
      - name: Pull Autoware Source
        run: |
            mkdir -p autoware/src
            vcs import --shallow autoware/src < autoware/repositories/autoware.repos
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ${{ matrix.target }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX_COMPONENT }}
          bake-target: docker-metadata-action-${{ matrix.target }}
          tags: |
            type=raw,value=${{ matrix.target }}-${{ needs.detect-autoware-tag.outputs.autoware_tag }}
          flavor: |
            latest=false

      - name: Ensure upstream Autoware base images exist
        env:
          ROS_DISTRO: jazzy
          UPSTREAM_TAG: ${{ needs.detect-autoware-tag.outputs.autoware_tag }}
        run: |
          set -euo pipefail
          refs=$(docker buildx bake -f "${BAKE_FILE}" --print ${{ matrix.target || 'universe-common' }} 2>/dev/null \
            | jq -r '[.target[].contexts // {} | to_entries[].value]
                     | map(select(startswith("docker-image://ghcr.io/autowarefoundation/autoware:")))
                     | unique[]' | sed 's#^docker-image://##')
          [ -z "${refs}" ] && { echo "No upstream refs for this group."; exit 0; }
          fail=0
          while IFS= read -r ref; do
            [ -z "${ref}" ] && continue
            if docker buildx imagetools inspect "${ref}" >/dev/null 2>&1; then echo "OK: ${ref}";
            else echo "::error::Missing upstream image: ${ref}"; fail=1; fi
          done <<< "${refs}"
          [ "${fail}" -eq 0 ]

      - name: Build and push ${{ matrix.target }}
        uses: docker/bake-action@v5
        env:
          ROS_DISTRO: jazzy
          UPSTREAM_TAG: ${{ needs.detect-autoware-tag.outputs.autoware_tag }}
        with:
          files: |
            ${{ env.BAKE_FILE }}
            ${{ steps.meta.outputs.bake-file }}
          targets: ${{ matrix.target }}
          push: true
          set: |
            *.contexts.universe-common-devel=docker-image://${{ env.IMAGE_PREFIX_COMPONENT }}:universe-common-devel-${{ needs.detect-autoware-tag.outputs.autoware_tag }}
            *.contexts.universe-common=docker-image://${{ env.IMAGE_PREFIX_COMPONENT }}:universe-common-${{ needs.detect-autoware-tag.outputs.autoware_tag }}

  # =============================================================================
  # Stage 3: Build universe and universe-cuda images (parallel)
  # =============================================================================
  build-universe:
    runs-on: ${{ (github.repository_owner == 'youtalk' && github.actor == 'youtalk') && 'ubicloud-standard-16' || 'ubuntu-22.04' }}
    needs: [detect-autoware-tag, build-universe-common, build-components]
    if: needs.detect-autoware-tag.outputs.should_run == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: universe
          - target: universe-cuda
    steps:
      - name: Install jq and vcs2l
        run: |
          sudo apt-get update
          sudo apt-get install -y jq python3-pip
          pip install --no-cache-dir vcs2l
        shell: bash

      - name: Checkout OpenADKit repository
        uses: actions/checkout@v6

      - name: Checkout Autoware repository
        uses: actions/checkout@v6
        with:
          repository: autowarefoundation/autoware
          ref: ${{ needs.detect-autoware-tag.outputs.autoware_tag }}
          path: autoware
          fetch-depth: 1
    
      - name: Pull Autoware Source
        run: |
            mkdir -p autoware/src
            vcs import --shallow autoware/src < autoware/repositories/autoware.repos
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata for ${{ matrix.target }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX_COMPONENT }}
          bake-target: docker-metadata-action-${{ matrix.target }}
          tags: |
            type=raw,value=${{ matrix.target }}-${{ needs.detect-autoware-tag.outputs.autoware_tag }}
          flavor: |
            latest=false

      - name: Ensure upstream Autoware base images exist
        env:
          ROS_DISTRO: jazzy
          UPSTREAM_TAG: ${{ needs.detect-autoware-tag.outputs.autoware_tag }}
        run: |
          set -euo pipefail
          refs=$(docker buildx bake -f "${BAKE_FILE}" --print ${{ matrix.target || 'universe-common' }} 2>/dev/null \
            | jq -r '[.target[].contexts // {} | to_entries[].value]
                     | map(select(startswith("docker-image://ghcr.io/autowarefoundation/autoware:")))
                     | unique[]' | sed 's#^docker-image://##')
          [ -z "${refs}" ] && { echo "No upstream refs for this group."; exit 0; }
          fail=0
          while IFS= read -r ref; do
            [ -z "${ref}" ] && continue
            if docker buildx imagetools inspect "${ref}" >/dev/null 2>&1; then echo "OK: ${ref}";
            else echo "::error::Missing upstream image: ${ref}"; fail=1; fi
          done <<< "${refs}"
          [ "${fail}" -eq 0 ]

      - name: Build and push ${{ matrix.target }}
        uses: docker/bake-action@v5
        env:
          ROS_DISTRO: jazzy
          UPSTREAM_TAG: ${{ needs.detect-autoware-tag.outputs.autoware_tag }}
        with:
          files: |
            ${{ env.BAKE_FILE }}
            ${{ steps.meta.outputs.bake-file }}
          targets: ${{ matrix.target }}
          push: true
          set: |
            *.contexts.sensing-perception=docker-image://${{ env.IMAGE_PREFIX_COMPONENT }}:sensing-perception-${{ needs.detect-autoware-tag.outputs.autoware_tag }}
            *.contexts.sensing-perception-cuda=docker-image://${{ env.IMAGE_PREFIX_COMPONENT }}:sensing-perception-cuda-${{ needs.detect-autoware-tag.outputs.autoware_tag }}
            *.contexts.localization-mapping=docker-image://${{ env.IMAGE_PREFIX_COMPONENT }}:localization-mapping-${{ needs.detect-autoware-tag.outputs.autoware_tag }}
            *.contexts.planning-control=docker-image://${{ env.IMAGE_PREFIX_COMPONENT }}:planning-control-${{ needs.detect-autoware-tag.outputs.autoware_tag }}
            *.contexts.vehicle-system=docker-image://${{ env.IMAGE_PREFIX_COMPONENT }}:vehicle-system-${{ needs.detect-autoware-tag.outputs.autoware_tag }}
            *.contexts.api=docker-image://${{ env.IMAGE_PREFIX_COMPONENT }}:api-${{ needs.detect-autoware-tag.outputs.autoware_tag }}
            *.contexts.visualizer=docker-image://${{ env.IMAGE_PREFIX_COMPONENT }}:visualizer-${{ needs.detect-autoware-tag.outputs.autoware_tag }}
            *.contexts.simulator=docker-image://${{ env.IMAGE_PREFIX_COMPONENT }}:simulator-${{ needs.detect-autoware-tag.outputs.autoware_tag }}
