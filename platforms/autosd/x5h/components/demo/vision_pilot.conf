# VisionPilot on the X5H NPU for the CES 2027 demo. Mounted over
# /usr/share/visionpilot/config/vision_pilot.conf by scripts/x5h-score-vp.sh
# (installed as /usr/sbin/x5h-score-vp).
source.mode              = ros2
engine.provider          = renesas
engine.device_id         = 0
# The artifact set is not relocatable: nnx/manifest.json records the path it
# was compiled at, and x5h-score-vp binds /opt/npu at /npu so that path
# resolves. Check with: grep -o '"/npu[^"]*' <set>/nnx/manifest.json | head -1
# v7c64carla, not the earlier v7. The v7 set packed AutoDrive curvature with
# a balance factor of 512, so it read at most 0.014 (a 340 m radius). Its
# frozen AutoSteer attention also came from real-road frames, and CARLA's
# rendering attends differently. On Town04's 74 m curve, v7 left the road in
# 5 of 8 runs on board 2 (2026-10-06). v7c64carla uses a factor of 64, a
# symmetric head range (radius 43 m and up) and an attention mean taken from
# CARLA frames: 8 of 8 runs passed (2026-10-07). On the held-out real clips
# 1 and 7, its distance, flag and lane outputs grade the same as v7.
# The _v201 set is the same model compiled with EP v2.0.1 for the cacr memory
# map (2026-10-15). Graded against fp32 on clips 1 and 7 and the CARLA curve,
# it matches the EP v1.1.0 set, which does not run on the cacr map.
engine.artifacts_dir     = /npu/perf/merged/v7c64carla_frozen_s3cal_v201_artifacts
# The ARC programs the NPU driver loads to power the engine on. The EP appends
# /arc_prog_npus to this path itself. They must come from the release of the
# EP library in the image: with another set the driver never reaches "Set
# programs and power on", every inference returns RenesasBackendExecute
# failed, and VisionPilot dies in its own offload gate (board 2, 2026-09-18).
# /npu/ort-2.0.1/binary is the set shipped with EP v2.0.1.
engine.arc_prog_path     = /npu/ort-2.0.1/binary
engine.require_npu_nodes = 1
model.merged             = true
# The 147.3 MB model lives on the workstation at
# x5h-work/npu/merged/v7c64carla_frozen_s3cal_v201_artifacts/v7c64carla_frozen.onnx; the
# board's copy of the artifact set holds only compiler intermediates, and the
# Renesas session loads the set's qdq_inserted_legalized_*.onnx from
# engine.artifacts_dir.
model.merged_path        = /npu/perf/merged/v7c64carla_frozen_s3cal_v201_artifacts/v7c64carla_frozen.onnx
model.contract           = /npu/v7c64carla-contract.json
model.precision          = fp32
# Board-measured 2026-09-18: this was 4.0, carried in from VisionPilot's own
# example config when the board image was first written, with no reason
# recorded. Every gate number is measured at 12.0 (gate D4's lap averages
# 11.82 m/s, gate D6 stops from 12 m/s), and the bench config has said 12.0
# with a comment since it was written. At 4.0 a -3 m/s2 Safety Island stop is
# over in 1.3 s and gate D6's board route fails never_moving by construction.
speed_limit              = 12.0
L                        = 2.860
visualization_on         = false
# The DisplayPort backup for adas-dashboard. If a monitor is on DP0 when
# VisionPilot starts, OTA visionpilot v3 and later show the HUD on it through
# this DRM driver. A monitor plugged in later needs a VisionPilot restart.
# Images without the KMS sink ignore the key.
kms_display              = rcar-vcon
record_dir               =
radar.enabled            = false
# These lines feed adas-dashboard, the main display. Images without the
# dashboard sender ignore them.
dashboard_on             = true
dashboard_device         = R-Car X5H
dashboard_rear_axle_m    = 1.4
