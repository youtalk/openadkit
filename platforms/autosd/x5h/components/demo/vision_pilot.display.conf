# VisionPilot on the X5H NPU, with its HUD on the DisplayPort monitor. For a
# bench debug session. Not for the demo.
#
# Stage this over /etc/containers/systemd/vision_pilot.conf in place of
# vision_pilot.conf for one session, then put the original back.
# x5h-vp.container mounts that path read-only into the container, so no Quadlet
# is edited for the configuration itself.
#
# It differs from vision_pilot.conf in two lines, and only those two, which
# tests/test-display-conf.sh enforces:
#   visualization_on = true       VisionPilot composes its production HUD.
#   kms_display      = rcar-vcon  KmsDisplay shows it through that DRM driver.
#
# **The board image has to carry the sink.** The demo image is built from
# feat/x5h-carla-npu, which has no kms_display.cpp; on it the key is read by
# nothing and the monitor shows only the console. Build
# localhost/x5h-visionpilot:display from feat/x5h-carla-npu-display (README,
# "DisplayPort output") and point x5h-vp.container at that tag for the session.
#
# **Composing the HUD costs time.** This is not a gate run, and its latency
# is not gate D5's number.
source.mode              = ros2
engine.provider          = renesas
engine.device_id         = 0
engine.artifacts_dir     = /npu/perf/merged/v7_frozen_s3cal_artifacts
engine.arc_prog_path     = /npu/hostapp/binary
engine.require_npu_nodes = 1
model.merged             = true
model.merged_path        = /npu/perf/merged/v7_frozen_s3cal_artifacts/v7_frozen.onnx
model.contract           = /npu/v7-contract.json
model.precision          = fp32
speed_limit              = 4.0
L                        = 2.860
visualization_on         = true
record_dir               =
kms_display              = rcar-vcon
radar.enabled            = false
