# Shipped to /etc/containers/containers.conf.d/50-x5h.conf.
# The BSP kernel has no NF_TABLES; netavark's default nftables driver cannot
# work there. Force the iptables driver (x_tables is present as modules).
# The QEMU gate probes whether CentOS Stream 10's iptables-nft userspace can
# drive it; gate falls back to firewall_driver="none" and records the finding.
[network]
firewall_driver = "iptables"
